<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Strike</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
  canvas{display:block;margin:0 auto;background:#05060f;max-width:100%;max-height:100%}
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const rand=(a,b)=>a+Math.random()*(b-a);
let state='menu',score=0,best=+localStorage.getItem('novaBest')||0,wave=1,shake=0,t=0;
let player,bullets,enemies,ebullets,parts,powers,stars,boss;
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
  if((e.code==='Enter'||e.code==='Space')&&state!=='play')start();});
addEventListener('keyup',e=>keys[e.code]=false);
let touchX=null;
cv.addEventListener('pointerdown',e=>{if(state!=='play')start();touchX=pos(e)});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')touchX=pos(e)});
addEventListener('pointerup',()=>touchX=null);
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}

// audio
let ac;
function sfx(f,d,type='square',v=.05,slide=0){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=f;o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),ac.currentTime+d);
  g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

function start(){
  player={x:W/2,y:H-90,w:26,speed:5,hp:3,fire:0,power:1,shield:0,inv:0,pt:0};
  bullets=[];enemies=[];ebullets=[];parts=[];powers=[];boss=null;
  stars=Array.from({length:90},()=>({x:rand(0,W),y:rand(0,H),s:rand(.5,3)}));
  score=0;wave=1;state='play';spawnWave();
}
function spawnWave(){
  if(wave%5===0){boss={x:W/2,y:-80,w:70,hp:60+wave*10,max:60+wave*10,dir:1,fire:0,phase:0};return}
  const n=5+wave*2;
  for(let i=0;i<n;i++){
    const kind=Math.random()<Math.min(.15+wave*.04,.5)?'zig':(Math.random()<.2?'tank':'drone');
    enemies.push({x:rand(30,W-30),y:-30-i*45,kind,hp:kind==='tank'?4:1,w:kind==='tank'?20:14,
      vy:rand(.8,1.4)+wave*.07,ph:rand(0,6),fire:rand(60,200)});
  }
}
function boom(x,y,c,n=18){for(let i=0;i<n;i++){const a=rand(0,6.28),s=rand(1,5);
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rand(20,45),c})}sfx(120,.25,'sawtooth',.08,-80)}
function hurt(){
  if(player.inv>0)return;
  if(player.shield>0){player.shield=0;player.inv=60;sfx(300,.2,'sine',.08);return}
  player.hp--;player.inv=90;shake=14;player.power=Math.max(1,player.power-1);boom(player.x,player.y,'#4cf',25);
  if(player.hp<=0){state='over';best=Math.max(best,score);localStorage.setItem('novaBest',best)}
}
function shoot(){
  const p=player.power;
  const add=(dx,vx)=>bullets.push({x:player.x+dx,y:player.y-18,vx,vy:-11});
  if(p===1)add(0,0);else if(p===2){add(-8,0);add(8,0)}else{add(-10,-1.5);add(0,0);add(10,1.5);if(p>=4){add(-18,-3);add(18,3)}}
  sfx(880,.07,'square',.025,-500);
}
function update(){
  t++;
  stars.forEach(s=>{s.y+=s.s;if(s.y>H){s.y=0;s.x=rand(0,W)}});
  if(state!=='play'){parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l--});parts=parts.filter(p=>p.l>0);return}
  const p=player;
  let dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
  let dy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
  p.x+=dx*p.speed;p.y+=dy*p.speed;
  if(touchX){p.x+=(touchX.x-p.x)*.2;p.y+=(touchX.y-60-p.y)*.2}
  p.x=Math.max(20,Math.min(W-20,p.x));p.y=Math.max(60,Math.min(H-30,p.y));
  p.inv=Math.max(0,p.inv-1);p.shield=Math.max(0,p.shield-(p.shield>1?1:0));
  p.fire--;if((keys.Space||touchX||keys.KeyJ)&&p.fire<=0){shoot();p.fire=p.power>=3?9:11}
  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy});bullets=bullets.filter(b=>b.y>-20);
  enemies.forEach(e=>{
    e.y+=e.vy;if(e.kind==='zig')e.x+=Math.sin(t/20+e.ph)*3;
    e.fire--;if(e.fire<=0&&e.y>0&&e.y<H*.7){e.fire=rand(90,220)-wave*3;
      const a=Math.atan2(p.y-e.y,p.x-e.x);ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*(2.5+wave*.1),vy:Math.sin(a)*(2.5+wave*.1)})}
    if(Math.hypot(e.x-p.x,e.y-p.y)<e.w+14){e.hp=0;hurt();boom(e.x,e.y,'#f84')}
    bullets.forEach(b=>{if(!b.dead&&Math.abs(b.x-e.x)<e.w&&Math.abs(b.y-e.y)<e.w){b.dead=true;e.hp--;boom(b.x,b.y,'#ff8',3);
      if(e.hp<=0){score+=e.kind==='tank'?40:e.kind==='zig'?25:10;boom(e.x,e.y,'#f84');
        if(Math.random()<.12)powers.push({x:e.x,y:e.y,type:['gun','shield','heal'][Math.floor(rand(0,3))]})}}});
  });
  bullets=bullets.filter(b=>!b.dead);enemies=enemies.filter(e=>e.hp>0&&e.y<H+40);
  if(boss){
    boss.y+=(110-boss.y)*.03;boss.x+=boss.dir*(1.5+wave*.05);if(boss.x<60||boss.x>W-60)boss.dir*=-1;
    boss.fire--;if(boss.fire<=0){boss.fire=45;boss.phase++;
      const n=8+wave;for(let i=0;i<n;i++){const a=i/n*6.28+boss.phase*.3;ebullets.push({x:boss.x,y:boss.y,vx:Math.cos(a)*2.4,vy:Math.sin(a)*2.4})}sfx(200,.2,'sawtooth',.05,-100)}
    bullets.forEach(b=>{if(Math.abs(b.x-boss.x)<boss.w&&Math.abs(b.y-boss.y)<30){b.dead=true;boss.hp--;boom(b.x,b.y,'#fa4',2)}});
    if(boss.hp<=0){score+=500;shake=25;for(let i=0;i<8;i++)boom(boss.x+rand(-50,50),boss.y+rand(-20,20),'#fa4',20);boss=null;powers.push({x:W/2,y:150,type:'gun'},{x:W/2+40,y:150,type:'heal'})}
  }
  ebullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(Math.hypot(b.x-p.x,b.y-p.y)<9){b.y=H+99;hurt()}});
  ebullets=ebullets.filter(b=>b.y<H+20&&b.y>-20&&b.x>-20&&b.x<W+20);
  powers.forEach(u=>{u.y+=1.5;if(Math.hypot(u.x-p.x,u.y-p.y)<22){u.y=H+99;sfx(600,.2,'sine',.08,400);
    if(u.type==='gun')p.power=Math.min(4,p.power+1);else if(u.type==='shield')p.shield=600;else p.hp=Math.min(5,p.hp+1)}});
  powers=powers.filter(u=>u.y<H+20);
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.l--});parts=parts.filter(q=>q.l>0);
  if(!enemies.length&&!boss){wave++;spawnWave();sfx(500,.4,'sine',.06,500)}
  shake*=.9;
}
function ship(x,y,c,flip){ctx.save();ctx.translate(x,y);if(flip)ctx.scale(1,-1);ctx.fillStyle=c;ctx.beginPath();
  ctx.moveTo(0,-18);ctx.lineTo(14,14);ctx.lineTo(0,8);ctx.lineTo(-14,14);ctx.closePath();ctx.fill();ctx.restore()}
function draw(){
  ctx.save();if(shake>.5)ctx.translate(rand(-shake,shake),rand(-shake,shake));
  ctx.fillStyle='#05060f';ctx.fillRect(-20,-20,W+40,H+40);
  stars.forEach(s=>{ctx.fillStyle=`rgba(255,255,255,${s.s/3.2})`;ctx.fillRect(s.x,s.y,s.s>2?2:1,s.s*2)});
  if(state==='play'||state==='over'){
    powers.forEach(u=>{ctx.fillStyle={gun:'#fd3',shield:'#4cf',heal:'#4f8'}[u.type];ctx.beginPath();ctx.arc(u.x,u.y,10,0,6.28);ctx.fill();
      ctx.fillStyle='#000';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText({gun:'G',shield:'S',heal:'+'}[u.type],u.x,u.y+4)});
    enemies.forEach(e=>{ship(e.x,e.y,e.kind==='tank'?'#c4f':e.kind==='zig'?'#fa3':'#f45',true);
      if(e.kind==='tank'){ctx.fillStyle='#fff';ctx.fillRect(e.x-12,e.y-26,24*e.hp/4,3)}});
    if(boss){ctx.fillStyle='#e33';ctx.beginPath();ctx.moveTo(boss.x,boss.y+40);ctx.lineTo(boss.x+70,boss.y-30);ctx.lineTo(boss.x,boss.y-10);ctx.lineTo(boss.x-70,boss.y-30);ctx.closePath();ctx.fill();
      ctx.fillStyle='#222';ctx.fillRect(60,70,W-120,8);ctx.fillStyle='#f55';ctx.fillRect(60,70,(W-120)*boss.hp/boss.max,8)}
    ctx.fillStyle='#8ff';bullets.forEach(b=>ctx.fillRect(b.x-2,b.y-8,4,14));
    ctx.fillStyle='#f6a';ebullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,4,0,6.28);ctx.fill()});
    if(state==='play'&&(player.inv%8<4)){ship(player.x,player.y,'#4cf');
      ctx.fillStyle='#fa4';ctx.fillRect(player.x-3,player.y+10,6,6+Math.sin(t)*4);
      if(player.shield>0){ctx.strokeStyle='rgba(80,200,255,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(player.x,player.y,26,0,6.28);ctx.stroke()}}
    parts.forEach(q=>{ctx.globalAlpha=q.l/45;ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,3,3)});ctx.globalAlpha=1;
    ctx.fillStyle='#fff';ctx.font='bold 18px monospace';ctx.textAlign='left';ctx.fillText('SCORE '+score,12,26);
    ctx.textAlign='right';ctx.fillText('WAVE '+wave,W-12,26);
    ctx.textAlign='left';for(let i=0;i<player.hp;i++){ctx.fillStyle='#f45';ctx.fillRect(12+i*20,36,14,10)}
  }
  ctx.textAlign='center';ctx.fillStyle='#fff';
  if(state==='menu'){ctx.font='bold 56px sans-serif';ctx.fillStyle='#4cf';ctx.fillText('NOVA STRIKE',W/2,260);
    ctx.fillStyle='#fff';ctx.font='18px sans-serif';ctx.fillText('Press ENTER / tap to start',W/2,330);
    ctx.fillStyle='#9ab';ctx.font='14px sans-serif';ctx.fillText('Move: WASD / arrows   Fire: SPACE (or drag on touch)',W/2,380);
    ctx.fillText('G = more guns   S = shield   + = health   Boss every 5 waves',W/2,402);ctx.fillText('Best: '+best,W/2,440)}
  if(state==='over'){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f45';ctx.font='bold 48px sans-serif';ctx.fillText('GAME OVER',W/2,290);
    ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.fillText('Score '+score+'   Best '+best+'   Wave '+wave,W/2,340);ctx.fillText('Press ENTER / tap to retry',W/2,380)}
  ctx.restore();
}
stars=Array.from({length:90},()=>({x:rand(0,W),y:rand(0,H),s:rand(.5,3)}));parts=[];
(function loop(){update();draw();requestAnimationFrame(loop)})();
</script>
</body>
</html>
