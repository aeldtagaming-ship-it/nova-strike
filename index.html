<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=480,H=720,DEMO=/[?&]demo/.test(location.search);
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const rand=(a,b)=>a+Math.random()*(b-a),irand=(a,b)=>Math.floor(rand(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v;
let scores=[];try{scores=JSON.parse(localStorage.getItem('novaScores2')||'[]').filter(s=>s>0)}catch(e){}
const bestScore=()=>scores.length?scores[0]:0;

// ---------- audio ----------
let ac,muted=false;
function actx(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function tone(f,d,type='square',v=.04,slide=0){if(muted)return;try{const a=actx(),t0=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d)}catch(e){}}
function noise(d,v=.08){if(muted)return;try{const a=actx(),n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}

// ---------- input ----------
const keys={},pressed={};let ptr=null,state='menu',G=null,overT=0,menuT=0;
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat)return;keys[e.code]=true;pressed[e.code]=true});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{if(state==='play')state='pause'});
function ptrPos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{const p=ptrPos(e);try{actx()}catch(_){}

  if(state==='pause'){state='play';return}

  if(state==='play'){if(p.x>410&&p.y>630){pressed.KeyB=true;return}if(p.x<70&&p.y>630){pressed.KeyE=true;return}ptr={x:p.x,y:p.y,px:G.p.x,py:G.p.y}}});
cv.addEventListener('pointermove',e=>{if(ptr&&state==='play'){const p=ptrPos(e);G.p.tx=ptr.px+(p.x-ptr.x);G.p.ty=ptr.py+(p.y-ptr.y)}});

// ---------- online leaderboard (Supabase, free tier) ----------
const LB_URL='https://psntzmqxehztnsnwbuvb.supabase.co/rest/v1/scores',LB_KEY='sb_publishable_U-3dQ6yumJf3XR7cBqfLVQ_CujrMTRb';
let board=null,boardErr=false,myName='';try{myName=localStorage.getItem('novaName')||''}catch(e){}
const SHIPS=[{n:'VIPER',d:'Balanced. E: Phase Shift',hp:4,speed:4.6,rate:1,dmg:1,bombs:2,c:['#1f56c8','#8fdcff','#ff4d6d']},
 {n:'FALCON',d:'Fast, fragile. E: Overdrive',hp:3,speed:5.6,rate:1.25,dmg:.85,bombs:2,c:['#b8741a','#ffe9a8','#ff7a2e']},
 {n:'TITAN',d:'Slow, tough. E: Shockwave',hp:6,speed:3.9,rate:.85,dmg:1.35,bombs:3,c:['#168a66','#b4ffe0','#ffd24d']}];
let selShip=0;try{selShip=Math.min(2,Math.max(0,parseInt(localStorage.getItem('novaShip')||'0',10)||0))}catch(e){}
function cycleShip(d){selShip=(selShip+d+3)%3;try{localStorage.setItem('novaShip',String(selShip))}catch(e){}tone(520+selShip*120,.08,'sine',.05,0)}
let freeze=0;let daily=null;const todayId=()=>new Date().toISOString().slice(0,10).replace(/-/g,'');
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seededWave(fn){if(!daily)return fn();const o=Math.random;Math.random=mulberry(parseInt(daily,10)*31+G.wave*977);try{return fn()}finally{Math.random=o}}
function lbFetch(d){if(d===undefined)d=daily;fetch(LB_URL+'?select=name,score,wave&order=score.desc&limit=10&day='+(d?'eq.'+d:'is.null'),{headers:{apikey:LB_KEY}}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{board=d;boardErr=false}).catch(()=>{boardErr=true})}
function lbSubmit(name,score,wave,day){return fetch(LB_URL,{method:'POST',headers:{apikey:LB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(day?{name,score,wave,day}:{name,score,wave})}).then(r=>{if(!r.ok)throw 0}).then(()=>lbFetch(day||null)).catch(()=>{boardErr=true})}
const nameBox=document.createElement('input');nameBox.maxLength=12;nameBox.placeholder='Your name';nameBox.autocomplete='off';
nameBox.style.cssText='position:fixed;display:none;z-index:5;box-sizing:border-box;font:bold 18px monospace;text-align:center;padding:8px;border-radius:8px;border:2px solid #4fc3ff;background:#0a1030;color:#fff;outline:none';

function showNameBox(){const r=cv.getBoundingClientRect(),s=r.width/W;nameBox.style.left=(r.left+(W/2-110)*s)+'px';nameBox.style.top=(r.top+425*s)+'px';nameBox.style.width=220*s+'px';nameBox.style.height=40*s+'px';nameBox.style.fontSize=Math.max(14,18*s)+'px';nameBox.value='';nameBox.style.display='block';setTimeout(()=>nameBox.focus(),50)}

// ---------- visuals: glow, background ----------
const glowCache={};
function glow(x,y,r,c,a=1){let s=glowCache[c];if(!s){s=document.createElement('canvas');s.width=s.height=64;const g=s.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,c);gr.addColorStop(.35,c+'66');gr.addColorStop(1,c+'00');g.fillStyle=gr;g.fillRect(0,0,64,64);glowCache[c]=s}
  ctx.globalAlpha=a;ctx.drawImage(s,x-r,y-r,r*2,r*2);ctx.globalAlpha=1}
const neb=document.createElement('canvas');neb.width=W;neb.height=H;
(()=>{const g=neb.getContext('2d');g.fillStyle='#04050d';g.fillRect(0,0,W,H);const cols=['#3b1d8f','#0b4f9c','#7a1d6b','#0a6b6b'];
  for(let i=0;i<12;i++){const x=rand(0,W),y=rand(0,H),r=rand(120,250),c=cols[i%4];for(const oy of[-H,0,H]){const gr=g.createRadialGradient(x,y+oy,0,x,y+oy,r);gr.addColorStop(0,c+'55');gr.addColorStop(1,c+'00');g.fillStyle=gr;g.fillRect(x-r,y+oy-r,r*2,r*2)}}})();
const stars=[];for(let l=0;l<3;l++)for(let i=0;i<[45,30,16][l];i++)stars.push({x:rand(0,W),y:rand(0,H),l});
let bgY=0;const SECT=[[59,29,143],[143,29,59],[11,143,107],[143,107,11],[29,90,143]];let tint=[59,29,143],planet={x:300,y:-200,r:90,c:'#5b7bd6',k:0};
function bgPlanetReset(){planet.x=rand(60,W-60);planet.y=-planet.r*2.2;planet.r=rand(50,120);planet.k=irand(0,3);planet.c=['#5b7bd6','#d6735b','#5bd6a0','#c9a45b'][planet.k]}
function bgUpdate(sp=1){bgY=(bgY+.5*sp)%H;planet.y+=.22*sp;if(planet.y>H+planet.r*2.5)bgPlanetReset();{const T=SECT[G&&state!=='menu'?Math.floor(((G.wave||1)-1)/5)%SECT.length:0];for(let i=0;i<3;i++)tint[i]+=(T[i]-tint[i])*.01}for(const s of stars){s.y+=[.5,1.3,2.8][s.l]*sp;if(s.y>H){s.y-=H;s.x=rand(0,W)}}}
function bgDraw(){ctx.drawImage(neb,0,bgY-H);ctx.drawImage(neb,0,bgY);
  {const px=planet.x,py=planet.y,r=planet.r,gr=ctx.createRadialGradient(px-r*.4,py-r*.4,r*.1,px,py,r);gr.addColorStop(0,planet.c);gr.addColorStop(.6,'#10142a');gr.addColorStop(1,'#03040a');ctx.globalAlpha=.55;ctx.fillStyle=gr;ctx.beginPath();ctx.arc(px,py,r,0,6.283);ctx.fill();
   ctx.strokeStyle=planet.c;ctx.globalAlpha=.25;ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,py,r+2,0,6.283);ctx.stroke();ctx.globalAlpha=1;
   if(planet.k===3){ctx.strokeStyle='rgba(230,200,140,.35)';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(px,py,r*1.6,r*.35,-.35,0,6.283);ctx.stroke()}}
  ctx.globalCompositeOperation='lighter';ctx.fillStyle=`rgba(${tint[0]|0},${tint[1]|0},${tint[2]|0},.16)`;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
  for(const s of stars){ctx.fillStyle=`rgba(255,255,255,${[.35,.6,.9][s.l]})`;ctx.fillRect(s.x,s.y,s.l===2?1.6:1.2,s.l===2?7:s.l+1.5)}}

// ---------- game state ----------
const TYPES={drone:{hp:1,r:13,pts:10,vy:1.3},zig:{hp:2,r:13,pts:20,vy:1.0},tank:{hp:7,r:22,pts:60,vy:.55},diver:{hp:1,r:12,pts:25,vy:0},sniper:{hp:4,r:15,pts:50,vy:0},splitter:{hp:6,r:21,pts:45,vy:.7}};
const UPS=[
 {id:'rate',n:'Rapid Fire',d:'Fire 15% faster',max:5,f:p=>p.rate*=1.15},
 {id:'dmg',n:'Heavy Rounds',d:'+40% bullet damage',max:5,f:p=>p.dmg*=1.4},
 {id:'spd',n:'Thrusters',d:'Move faster',max:3,f:p=>p.speed+=.6},
 {id:'hull',n:'Hull Plating',d:'+1 max health and heal 1',max:3,f:p=>{p.maxhp++;p.hp=Math.min(p.maxhp,p.hp+1)}},
 {id:'pierce',n:'Piercing Shots',d:'Bullets pass through +1 enemy',max:3,f:p=>p.pierce++},
 {id:'home',n:'Homing Missiles',d:'Auto-seeking missiles, +1 per level',max:4,f:p=>p.homing++},
 {id:'wing',n:'Wingman Drone',d:'A drone fights beside you',max:2,f:p=>p.wing++},
 {id:'mag',n:'Magnet',d:'Pulls in power-ups from farther',max:3,f:p=>p.magnet+=70},
 {id:'regen',n:'Shield Regen',d:'Shield recharges over time',max:3,f:p=>p.regen++},
 {id:'bomb',n:'Bomb Pack',d:'+2 bombs (max 5)',max:9,f:p=>p.bombs=Math.min(5,p.bombs+2)},
 {id:'crit',n:'Lucky Hits',d:'+12% chance for 3x damage',max:4,f:p=>p.crit=(p.crit||0)+.12},
 {id:'gun',n:'Weapon Upgrade',d:'+1 weapon level (max 5)',max:4,f:p=>p.wpn=Math.min(5,p.wpn+1)}
];
let tutDone=false;try{tutDone=localStorage.getItem('novaTut')==='1'}catch(e){}
function startGame(tut,isDaily){
  hideNameBox();daily=isDaily?todayId():null;if(typeof tut!=='boolean')tut=!tutDone&&!DEMO;if(isDaily)tut=false;lbFetch(daily);
  const SH=SHIPS[daily||DEMO?0:selShip];
  G={score:0,wave:0,t:0,combo:0,comboT:0,maxCombo:0,kills:0,shake:0,flash:0,queue:[],bullets:[],eb:[],en:[],parts:[],rings:[],txt:[],pw:[],ms:[],met:[],beams:[],hzQ:[],warn:null,boss:null,banner:0,bannerTxt:'',bosses:0,cards:null,hitWave:false,newBest:false,msT:0,
    p:{x:W/2,y:H-110,hp:SH.hp,maxhp:SH.hp,fire:0,inv:0,shield:0,shieldCd:2200,bombs:SH.bombs,wpn:1,dmg:SH.dmg,rate:SH.rate,speed:SH.speed,sh:daily||DEMO?0:selShip,pierce:0,homing:0,wing:0,magnet:60,regen:0,tx:null,ty:null,up:{}}};
  G.tut=tut?{step:0,t:0,ok:false,wait:0,moved:0,shots:0,k0:0,bombed:false,got:false}:null;state='play';G.daily=daily;if(!daily&&!DEMO){const q=G.p;q.maxhp+=modLv('armor');q.hp=q.maxhp;q.rate*=1+.1*modLv('reactor');q.bombs+=modLv('rack');q.shield=[0,600,1200][modLv('emit')];q.magnet+=40*modLv('mag')}
  G.p.gun=daily?0:SAVE.gun;G.p.sk=SAVE.skin;nextWave();if(daily)popText(W/2,H/2+60,'DAILY CHALLENGE '+daily.slice(4,6)+'/'+daily.slice(6),'#ffd27a');tone(440,.25,'sine',.06,440);
}
function nextWave(){G.hzQ=[];G.beams=[];G.wave++;G.hitWave=false;const boss=G.wave%5===0;G.banner=130;G.bannerTxt=boss?'WARNING':'WAVE '+G.wave;spawnWave()}
function spawnWave(){return seededWave(spawnWave0)}
function spawnWave0(){
  const w=G.wave;if(w%5===0){const n=w/5,k=(n-1)%4,hp=110+w*16;G.boss={x:W/2,y:-90,hp,max:hp,r:46,t:0,kind:k,ph:0,f:60,f2:100,enter:true,hf:0,n,name:['DREADNOUGHT','SPECTER','HYDRA','OVERMIND'][k]};return}
  if(w>=4&&Math.random()<.35){if(Math.random()<.5){const n=9+Math.floor(w/2);for(let i=0;i<n;i++)G.hzQ.push({t:G.t+110+i*34,kind:'met',x:rand(30,W-30),vx:rand(-.9,.9),vy:rand(2,3.3),r:rand(14,26)});G.warn={s:'METEOR SHOWER',t:170}}else{for(let i=0;i<4+(w>10?1:0);i++)G.hzQ.push({t:G.t+150+i*115,kind:'beam',x:rand(40,W-40)});G.warn={s:'LASER GRID',t:170}}}
  let budget=3+w*1.7+Math.max(0,w-8)*1.3;const avail=['drone','zig'];if(w>=3)avail.push('tank','diver');if(w>=4)avail.push('sniper');if(w>=6)avail.push('splitter');
  const cost={drone:1,zig:1.4,tank:3.5,diver:1.4,sniper:3,splitter:3.2};let tm=70;const form=irand(0,2);
  while(budget>0){const ty=w<3?(Math.random()<.6?'drone':'zig'):avail[irand(0,avail.length-1)];budget-=cost[ty];
    const grp=(ty==='tank'||ty==='sniper'||ty==='splitter')?1:irand(2,5),bx=rand(60,W-60);
    for(let i=0;i<grp;i++){const x=form===0?bx+(i-grp/2)*38:form===1?bx+(i%2?1:-1)*i*22:rand(40,W-40);G.queue.push({t:G.t+tm+i*14,ty,x:clamp(x,24,W-24)})}
    tm+=rand(40,90)}
}
function mkEnemy(ty,x,y=-30){const d=TYPES[ty],w=G.wave,sc=1+Math.floor(w/6)*.5;
  const e={ty,x,y,sx:x,hp:Math.ceil(d.hp*sc),r:d.r,ph:rand(0,6.28),t:0,f:rand(70,170),vy:d.vy+Math.min(w*.03,.8),st:0,hf:0,dir:Math.random()<.5?-1:1,ty2:rand(70,160)};if(w>=8&&(ty==='drone'||ty==='zig'||ty==='diver')&&Math.random()<.1){e.elite=true;e.hp*=3;e.r+=5}e.max=e.hp;G.en.push(e)}
const bspd=()=>Math.min(2.0+G.wave*.09,4.8);
function ebul(x,y,a,s,c='#ff4fa3'){G.eb.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c})}
function aimAt(e){return Math.atan2(G.p.y-e.y,G.p.x-e.x)}
const mult=()=>1+Math.min(Math.floor(G.combo/4)*.25,4);

// ---------- effects ----------
function sparks(x,y,c,n,sp=4,l=30){for(let i=0;i<n;i++){const a=rand(0,6.283),s=rand(.5,sp);G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rand(l*.5,l),m:l,c})}}
function boom(x,y,c,n=22,big=1){sparks(x,y,c,n,5*big,38);sparks(x,y,'#ffffff',Math.floor(n/4),3*big,18);G.rings.push({x,y,r:4,m:34*big,c});noise(.25*big,.07)}
function popText(x,y,s,c='#ffffff'){G.txt.push({x,y,s,c,l:50})}
function shake(n){G.shake=Math.max(G.shake,n)}

// ---------- combat ----------
function hurt(){const p=G.p;if(p.inv>0)return;
  if(p.shield>0){p.shield=0;p.inv=70;p.shieldCd=Math.max(900,2200-p.regen*500);G.rings.push({x:p.x,y:p.y,r:10,m:60,c:'#4fc3ff'});tone(300,.25,'sine',.07,-150);return}
  p.hp--;p.inv=120;freeze=Math.max(freeze,4);G.hurtV=1;shake(14);G.flash=.35;p.wpn=Math.max(1,p.wpn-1);G.combo=0;G.hitWave=true;boom(p.x,p.y,'#4fc3ff',26);tone(110,.4,'sawtooth',.08,-60);
  if(p.hp<=0)gameOver()}
function gameOver(){state='over';overT=0;earnCredits();boom(G.p.x,G.p.y,'#4fc3ff',60,2);shake(24);
  G.newBest=G.score>bestScore()&&G.score>0;if(G.score>0){scores.push(G.score);scores.sort((a,b)=>b-a);scores=scores.slice(0,5)}try{localStorage.setItem('novaScores2',JSON.stringify(scores))}catch(e){}
  G.needName=false;G.submitted=false;
  if(!DEMO&&G.score>0){if(myName){G.submitted=true;lbSubmit(myName,G.score,G.wave,G.daily)}else{G.needName=true;showNameBox()}}}
function shoot(){const p=G.p,w=p.wpn,g=p.gun|0;
  const add=(dx,ang,dm=1,sp=11,pe=0)=>G.bullets.push({x:p.x+dx,y:p.y-18,vx:Math.sin(ang)*sp,vy:-Math.cos(ang)*sp,dmg:p.dmg*dm,pierce:p.pierce+pe,hit:[],seek:g===3});
  if(g===2){add(0,0,3.3+(w-1)*.5,14,4);if(w>=4){add(-12,-.05,1.2,14,2);add(12,.05,1.2,14,2)}}
  else if(g===1){const k=1.7,dm=.88;if(w===1){add(0,0,dm);add(-6,-.2,dm);add(6,.2,dm)}else if(w===2){add(-8,0,dm);add(8,0,dm);add(-10,-.26,dm);add(10,.26,dm)}else if(w===3){add(0,0,dm);add(-10,-.14*k,dm);add(10,.14*k,dm);add(-14,-.34,dm);add(14,.34,dm)}else{add(-8,0,dm);add(8,0,dm);add(-14,-.2*k,dm);add(14,.2*k,dm);add(-18,-.46,dm);add(18,.46,dm)}}
  else{const dm=g===3?.5:1;
    if(w===1)add(0,0,dm);else if(w===2){add(-8,0,dm);add(8,0,dm)}else if(w===3){add(0,0,dm);add(-10,-.12,dm);add(10,.12,dm)}else if(w===4){add(-8,0,dm);add(8,0,dm);add(-14,-.2,dm);add(14,.2,dm)}else{add(0,0,dm);add(-9,-.1,dm);add(9,.1,dm);add(-16,-.24,dm);add(16,.24,dm)}}
  for(let i=0;i<p.wing;i++){const sx=(p.wing===1?1:(i?1:-1))*38;G.bullets.push({x:p.x+sx,y:p.y,vx:0,vy:-11,dmg:p.dmg*.6,pierce:0,hit:[]})}
  if(G.tut)G.tut.shots++;tone(g===2?300:780,.05,g===2?'sawtooth':'square',.02,-420)}
const SPCD=[900,1000,1200];

  for(const eb of G.eb){eb.x+=eb.vx;eb.y+=eb.vy;const dd=Math.hypot(eb.x-p.x,eb.y-p.y);if(dd<9.5){eb.dead=true;hurt()}else if(dd<24&&!eb.gz&&p.inv<=0){eb.gz=1;G.graze=(G.graze||0)+1;G.score+=Math.round(5*mult());if(G.graze%25===0){p.bombs=Math.min(5,p.bombs+1);popText(p.x,p.y-30,'GRAZE BONUS +1 BOMB','#ffd27a')}else if(G.graze%5===0)popText(p.x,p.y-24,'GRAZE x'+G.graze,'#9fe8ff');sparks(p.x,p.y,'#9fe8ff',2,2,10)}}

    if(d<20){u.dead=true;if(G.tut)G.tut.got=true;tone(600,.2,'sine',.07,500);

    case'sniper':if(e.tele){ctx.strokeStyle='rgba(255,80,80,'+(.25+Math.random()*.3)+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);const a=aimAt(e);ctx.lineTo(x+Math.cos(a)*900,y+Math.sin(a)*900);ctx.stroke()}
      glowE(x,y,'#ffe14d',26);poly([[0,17],[14,0],[0,-17],[-14,0]],f?'#fff':'#ffe14d',x,y);poly([[0,10],[8,0],[0,-10],[-8,0]],f?'#fff':'#7a6a00',x,y);ctx.fillStyle=e.tele?'#ff3b3b':'#fff';ctx.beginPath();ctx.arc(x,y,3.5,0,6.283);ctx.fill();break}}
function drawElite(e){ctx.strokeStyle='rgba(255,210,77,'+(.55+Math.sin(e.t/6)*.3)+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,e.r+5,0,6.283);ctx.stroke();ctx.globalCompositeOperation='lighter';glow(e.x,e.y,e.r+14,'#ffd24d',.35);ctx.globalCompositeOperation='source-over';ctx.fillStyle='#222';ctx.fillRect(e.x-14,e.y-e.r-12,28,3);ctx.fillStyle='#ffd24d';ctx.fillRect(e.x-14,e.y-e.r-12,28*Math.max(0,e.hp)/e.max,3)}
function glowE(x,y,c,r){ctx.globalCompositeOperation='lighter';glow(x,y,r,c,.55);ctx.globalCompositeOperation='source-over'}
function drawBoss(b){const x=b.x,y=b.y,c=['#ff3b4f','#b44dff','#22d6a2','#ffd24d'][b.kind],d=['#7a1220','#4a1a85','#0b6b52','#7a5a00'][b.kind],f=b.hf>0;
  ctx.globalCompositeOperation='lighter';glow(x,y,130,c,.35);ctx.globalCompositeOperation='source-over';
  poly([[0,50],[80,-20],[60,-34],[34,-18],[0,-40],[-34,-18],[-60,-34],[-80,-20]],f?'#fff':c,x,y);
  poly([[0,36],[48,-12],[28,-24],[0,-28],[-28,-24],[-48,-12]],f?'#fff':d,x,y);
  poly([[-80,-20],[-92,6],[-62,-6]],f?'#fff':d,x,y);poly([[80,-20],[92,6],[62,-6]],f?'#fff':d,x,y);
  const pulse=.6+Math.sin(b.t/8)*.3;ctx.globalCompositeOperation='lighter';glow(x,y,34,'#ffffff',pulse);glow(x,y,20,c,1);ctx.globalCompositeOperation='source-over';
  if(b.kind===3){ctx.strokeStyle=c;ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(x,y,16+i*9+Math.sin(b.t/10+i)*2,0,6.283);ctx.stroke()}}
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,7,0,6.283);ctx.fill();
  const bw=300,bx=(W-bw)/2;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(bx-2,58,bw+4,12);ctx.fillStyle=c;ctx.fillRect(bx,60,bw*Math.max(0,b.hp)/b.max,8);
  ctx.fillStyle='#fff';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText(b.name,W/2,54)}
function drawWorld(){const g=G,t=g.t;
  ctx.globalCompositeOperation='lighter';
  for(const q of g.parts){ctx.globalAlpha=Math.max(0,q.l/q.m);ctx.fillStyle=q.c;ctx.fillRect(q.x-1.2,q.y-1.2,2.6,2.6)}ctx.globalAlpha=1;
  for(const r of g.rings){ctx.globalAlpha=Math.max(0,1-r.r/r.m)*.8;ctx.strokeStyle=r.c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.283);ctx.stroke()}ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  for(const u of g.pw){const c={gun:'#ffe14d',shield:'#4fc3ff',heal:'#5dff9a',bomb:'#ffd27a',rapid:'#ff6bff'}[u.t];ctx.globalCompositeOperation='lighter';glow(u.x,u.y,26,c,.8);ctx.globalCompositeOperation='source-over';
    ctx.fillStyle=c;ctx.beginPath();ctx.arc(u.x,u.y+Math.sin(u.ph)*2,10,0,6.283);ctx.fill();ctx.fillStyle='#101420';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText({gun:'G',shield:'S',heal:'+',bomb:'B',rapid:'R'}[u.t],u.x,u.y+4+Math.sin(u.ph)*2)}
  for(const m of g.met){ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.rot);ctx.fillStyle=m.hf>0?'#fff':'#6e6358';ctx.beginPath();for(let i=0;i<9;i++){const a=i/9*6.283,rr=m.r*(.78+((i*37)%5)*.07);ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.fillStyle='#4a423a';ctx.beginPath();ctx.arc(-m.r*.25,-m.r*.15,m.r*.3,0,6.283);ctx.fill();ctx.restore();ctx.globalCompositeOperation='lighter';glow(m.x,m.y-m.r*.6,m.r*1.3,'#ff9d3c',.18);ctx.globalCompositeOperation='source-over'}
  for(const b of g.beams){if(b.t<=70){const a=.25+.35*Math.abs(Math.sin(b.t/5));ctx.fillStyle='rgba(255,60,60,'+a+')';ctx.fillRect(b.x-1,0,2,H);ctx.fillStyle='rgba(255,60,60,'+(a*.25)+')';ctx.fillRect(b.x-13,0,26,H)}else if(b.t<100){const f=1-(b.t-70)/35;ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,40,40,'+(.6*Math.max(.2,f))+')';ctx.fillRect(b.x-24,0,48,H);ctx.fillStyle='rgba(255,255,255,'+Math.max(.3,f)+')';ctx.fillRect(b.x-7,0,14,H);ctx.globalCompositeOperation='source-over'}else{ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,120,120,'+(.3*(1-(b.t-100)/5))+')';ctx.fillRect(b.x-10,0,20,H);ctx.globalCompositeOperation='source-over'}}
  for(const e of g.en)drawEnemy(e);if(g.boss)drawBoss(g.boss);
  ctx.globalCompositeOperation='lighter';
  for(const m of g.ms){glow(m.x,m.y,14,'#ffb347',.9);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(m.x,m.y,2.5,0,6.283);ctx.fill()}
  for(const b of g.bullets){const big=b.dmg>1.5,bc=skinOf(g.p).b;ctx.strokeStyle=bc;ctx.globalAlpha=.3;ctx.lineWidth=big?4:2;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*2.4,b.y-b.vy*2.4);ctx.stroke();ctx.globalAlpha=1;glow(b.x,b.y,big?18:12,bc,.8);ctx.fillStyle='#e6fcff';ctx.fillRect(b.x-(big?2.2:1.6),b.y-8,big?4.4:3.2,16)}
  for(const b of g.eb){glow(b.x,b.y,13,b.c,.85);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,3.2,0,6.283);ctx.fill()}
  ctx.globalCompositeOperation='source-over';
  if(state!=='over')drawPlayer(g.p,t);
  for(const q of g.txt){ctx.globalAlpha=Math.min(1,q.l/20);ctx.fillStyle=q.c;ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.fillText(q.s,q.x,q.y)}ctx.globalAlpha=1}
function txtC(s,y,size,c,font='system-ui,sans-serif',w='bold'){ctx.textAlign='center';ctx.font=`${w} ${size}px ${font}`;ctx.fillStyle=c;ctx.fillText(s,W/2,y)}
function wrapTxt(s,w){const out=[];let line='';for(const word of s.split(' ')){const t=line?line+' '+word:word;if(ctx.measureText(t).width>w&&line){out.push(line);line=word}else line=t}out.push(line);return out}
function drawSpecial(){const p=G.p,s=p.sh|0,cd=SPCD[s]||900,f=1-Math.max(0,p.spcd|0)/cd,cx=36,cy=H-36,ready=(p.spcd|0)<=0,col=['#8fdcff','#ffb347','#5dff9a'][s];
  ctx.fillStyle='rgba(4,8,20,.65)';ctx.beginPath();ctx.arc(cx,cy,19,0,6.283);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,19,0,6.283);ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,19,-1.5708,-1.5708+f*6.283);ctx.stroke();
  if(ready){ctx.globalCompositeOperation='lighter';glow(cx,cy,30,col,.35+Math.sin(G.t/8)*.15);ctx.globalCompositeOperation='source-over'}
  ctx.textAlign='center';ctx.font='bold 14px system-ui,sans-serif';ctx.fillStyle=ready?'#fff':'#7f8fb3';ctx.fillText('E',cx,cy+5)}
function drawTut(){const T=G.tut,s=TUT[T.step];if(!s)return;const x=52,y=108,w=376,h=92;
  ctx.fillStyle='rgba(8,14,40,.8)';ctx.fillRect(x,y,w,h);ctx.strokeStyle=T.ok?'#5dff9a':'#4fc3ff';ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);
  ctx.textAlign='left';ctx.font='bold 11px monospace';ctx.fillStyle='#8fdcff';ctx.fillText('TUTORIAL '+(T.step+1)+'/6',x+12,y+18);
  ctx.textAlign='right';ctx.fillStyle='#7f90bb';ctx.fillText('T = skip',x+w-12,y+18);
  ctx.textAlign='left';ctx.font='bold 20px system-ui,sans-serif';ctx.fillStyle=T.ok?'#5dff9a':'#fff';ctx.fillText((T.ok?'\u2713 ':'')+s.t,x+12,y+44);
  ctx.font='13px system-ui,sans-serif';ctx.fillStyle='#c9d6ff';wrapTxt(s.d,w-24).slice(0,2).forEach((l,i)=>ctx.fillText(l,x+12,y+64+i*16))}
function drawHUD(){const g=G,p=g.p;ctx.textAlign='left';ctx.font='bold 18px monospace';ctx.fillStyle='#fff';ctx.fillText('SCORE '+g.score,12,26);
  ctx.textAlign='right';ctx.fillText('WAVE '+g.wave,W-12,26);
  for(let i=0;i<p.maxhp;i++){ctx.fillStyle=i<p.hp?'#ff4d6d':'#3a1f2a';ctx.beginPath();ctx.moveTo(14+i*20,40);ctx.lineTo(24+i*20,40);ctx.lineTo(24+i*20,46);ctx.lineTo(19+i*20,52);ctx.lineTo(14+i*20,46);ctx.closePath();ctx.fill()}
  ctx.textAlign='left';ctx.font='bold 11px monospace';ctx.fillStyle='#ffd27a';ctx.fillText('BOMBS '+'\u25CF'.repeat(p.bombs)+'\u25CB'.repeat(5-p.bombs),12,70);
  ctx.fillStyle='#ffe14d';ctx.fillText('GUN LV'+p.wpn,12,84);
  if(g.combo>=2){ctx.textAlign='right';ctx.font='bold 14px monospace';ctx.fillStyle='#5dff9a';ctx.fillText('COMBO '+g.combo+'  x'+mult().toFixed(2),W-12,46);ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(W-112,52,100,4);ctx.fillStyle='#5dff9a';ctx.fillRect(W-112,52,100*g.comboT/160,4)}
  if('ontouchstart' in window){ctx.globalAlpha=.5;ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(448,668,26,0,6.283);ctx.fill();ctx.fillStyle='#101420';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('BOMB',448,673);ctx.globalAlpha=1}
  if(g.banner>0){const a=Math.min(1,g.banner/30,(130-g.banner)/15);ctx.globalAlpha=a;const boss=g.wave%5===0;txtC(g.bannerTxt,H/2-60,boss?46:40,boss?'#ff4d6d':'#8fdcff');
    if(boss)txtC('BOSS APPROACHING',H/2-26,16,'#fff');ctx.globalAlpha=1}}
function drawCards(){ctx.fillStyle='rgba(2,3,12,.72)';ctx.fillRect(0,0,W,H);txtC('WAVE '+(G.wave)+' CLEARED',120,30,'#8fdcff');txtC('Choose an upgrade  (press 1 / 2 / 3 or tap)',152,14,'#c9d6ff');
  G.cards.forEach((u,i)=>{const y=200+i*130,lv=(G.p.up[u.id]||0);ctx.fillStyle='rgba(30,40,90,.85)';ctx.fillRect(40,y,400,112);ctx.strokeStyle='#4fc3ff';ctx.lineWidth=2;ctx.strokeRect(40,y,400,112);
    ctx.textAlign='left';ctx.fillStyle='#4fc3ff';ctx.font='bold 26px monospace';ctx.fillText(String(i+1),58,y+66);ctx.fillStyle='#fff';ctx.font='bold 22px system-ui,sans-serif';ctx.fillText(u.n,100,y+44);
    ctx.fillStyle='#b8c6f0';ctx.font='15px system-ui,sans-serif';ctx.fillText(u.d,100,y+72);ctx.fillStyle='#ffd27a';ctx.font='bold 12px monospace';ctx.fillText('LEVEL '+lv+' > '+(lv+1)+'  /  '+u.max,100,y+96)})}
function drawMenu(){const t=menuT;txtC('NOVA STRIKE',230,58,'#4fc3ff');ctx.globalCompositeOperation='lighter';glow(W/2,215,200,'#2f6bff',.25+Math.sin(t/30)*.08);ctx.globalCompositeOperation='source-over';
  drawPlayer({x:W/2,y:330+Math.sin(t/25)*8,wing:1,shield:0,inv:0,sh:selShip,sk:SAVE.skin},t);txtC('<   '+SHIPS[selShip].n+'   >',386,15,'#fff');txtC(SHIPS[selShip].d+'  |  HP '+SHIPS[selShip].hp+'  BOMBS '+SHIPS[selShip].bombs,404,11,'#9fb0d8');
  txtC('Press ENTER or tap to start',432,20,'#fff');ctx.fillStyle='#9fb0d8';
  txtC('Move: WASD / arrows    Fire: SPACE (hold)',470,14,'#9fb0d8');txtC('Bomb: B   Special: E   Focus (slow): SHIFT',492,14,'#9fb0d8');txtC('Pause: P    Mute: M    Touch: drag to move, auto-fire',514,14,'#9fb0d8');
  ctx.strokeStyle='#4fc3ff';ctx.lineWidth=1.5;ctx.strokeRect(60,552,170,28);ctx.textAlign='center';ctx.font='bold 13px system-ui,sans-serif';ctx.fillStyle='#8fdcff';ctx.fillText('HOW TO PLAY (H)',145,571);ctx.strokeStyle='#ffd27a';ctx.strokeRect(250,552,170,28);ctx.textAlign='center';ctx.fillStyle='#ffd27a';ctx.font='bold 13px system-ui,sans-serif';ctx.fillText('DAILY CHALLENGE (D)',335,571);
  ctx.strokeStyle='#8fdcff';ctx.lineWidth=1.5;ctx.strokeRect(150,590,180,28);ctx.fillStyle='rgba(60,130,255,.15)';ctx.fillRect(150,590,180,28);txtC('HANGAR (S)    '+SAVE.credits+' CR',609,13,'#ffd27a');
  if(board&&board.length){txtC('WORLD TOP 3',644,13,'#ffd27a','monospace');board.slice(0,3).forEach((s,i)=>txtC((i+1)+'.  '+s.name+'  '+s.score,664+i*17,14,'#fff','monospace'))}
  else if(scores.length){txtC('YOUR BEST',644,13,'#ffd27a','monospace');scores.slice(0,3).forEach((s,i)=>txtC((i+1)+'.  '+s,664+i*17,14,'#fff','monospace'))}}
function drawOver(){ctx.fillStyle='rgba(2,3,12,.72)';ctx.fillRect(0,0,W,H);txtC('GAME OVER',200,52,'#ff4d6d');if(G.newBest)txtC('NEW PERSONAL BEST!',236,18,'#ffd27a');
  txtC('Score  '+G.score,288,26,'#fff','monospace');txtC('Wave '+G.wave+'  Kills '+G.kills+'  Graze '+(G.graze||0)+'  Combo '+G.maxCombo+'  Bosses '+G.bosses,320,13,'#b8c6f0','monospace');
  if(G.credits)txtC('+'+G.credits+' CREDITS   (total '+SAVE.credits+')',346,13,'#ffd27a','monospace');
  if(G.needName){txtC('Enter your name for the world leaderboard',400,16,'#8fdcff');txtC('ENTER = submit      ESC = skip',496,13,'#9fb0d8','monospace');return}
  if(board&&board.length){txtC(G.daily?'TODAY TOP 10':'WORLD TOP 10',366,14,'#ffd27a','monospace');let me=-1;if(G.submitted)me=board.findIndex(s=>s.name===myName&&s.score===G.score);
    board.slice(0,10).forEach((s,i)=>{ctx.textAlign='left';ctx.font='15px monospace';ctx.fillStyle=i===me?'#5dff9a':'#fff';ctx.fillText(String(i+1).padStart(2)+'. '+s.name.padEnd(12),110,392+i*20);ctx.textAlign='right';ctx.fillText(String(s.score),370,392+i*20)});
    if(G.submitted&&me<0)txtC('Your score was submitted',604,12,'#9fb0d8','monospace')}
  else{txtC(boardErr?'Leaderboard offline. Your best scores:':'YOUR BEST SCORES',380,14,'#ffd27a','monospace');scores.forEach((s,i)=>txtC((i+1)+'.  '+s,410+i*22,16,'#fff','monospace'))}
  if(overT>40){txtC('Press ENTER or tap to play again',646,18,'#8fdcff');txtC('S = HANGAR  (spend credits on guns, skins, mods)',690,12,'#ffd27a','monospace')}}
const vig=document.createElement('canvas');vig.width=W;vig.height=H;(()=>{const g=vig.getContext('2d'),gr=g.createRadialGradient(W/2,H/2,H*.38,W/2,H/2,H*.78);gr.addColorStop(0,'rgba(0,0,8,0)');gr.addColorStop(1,'rgba(0,0,8,.55)');g.fillStyle=gr;g.fillRect(0,0,W,H)})();
function draw(){
  ctx.save();if(G&&G.shake>.5&&state!=='pause')ctx.translate(rand(-G.shake,G.shake),rand(-G.shake,G.shake));
  if(state!=='hangar')bgDraw();
  if(state==='menu')drawMenu();
  else if(state==='hangar')drawHangar();
  else{drawWorld();if(state!=='over'){drawHUD();if(state==='play'||state==='pause')drawSpecial()}if(G.warn&&state==='play'){ctx.globalAlpha=Math.min(1,G.warn.t/25)*(.6+.4*Math.abs(Math.sin(G.warn.t/6)));txtC('! '+G.warn.s+' !',160,22,'#ff5a5a');ctx.globalAlpha=1}if(G.tut&&state==='play')drawTut();
    if(state==='upgrade')drawCards();if(state==='over')drawOver();
    if(state==='pause'){ctx.fillStyle='rgba(2,3,12,.6)';ctx.fillRect(0,0,W,H);txtC('PAUSED',H/2,44,'#fff');txtC('Press P / tap to resume',H/2+34,16,'#9fb0d8')}
    if(G.flash>.02){ctx.fillStyle=`rgba(255,255,255,${Math.min(.8,G.flash)})`;ctx.fillRect(-10,-10,W+20,H+20)}}
  if(G&&state!=='menu'&&state!=='hangar'){const v=Math.max(G.hurtV||0,(G.p&&G.p.hp===1&&state==='play')?.28+.14*Math.sin(G.t/8):0);if(v>.02){const gr=ctx.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.72);gr.addColorStop(0,'rgba(255,0,40,0)');gr.addColorStop(1,'rgba(255,0,40,'+(v*.5)+')');ctx.fillStyle=gr;ctx.fillRect(-10,-10,W+20,H+20)}}
  ctx.drawImage(vig,0,0);
  ctx.restore()}
// ---------- main loop (fixed 60Hz timestep) ----------
let last=0,acc=0;
function loop(ts){const dt=Math.min(100,ts-(last||ts));last=ts;acc+=dt;let n=0;while(acc>=16.667&&n++<5){update();acc-=16.667}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
