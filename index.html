<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Nova Strike</title>
<style>
  html,body{margin:0;height:100%;background:#03040a;overflow:hidden;font-family:system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none;background:#03040a}
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=480,H=720,DEMO=/[?&]demo/.test(location.search);
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const rand=(a,b)=>a+Math.random()*(b-a),irand=(a,b)=>Math.floor(rand(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v;
let scores=[];try{scores=JSON.parse(localStorage.getItem('novaScores2')||'[]').filter(s=>s>0)}catch(e){}
const bestScore=()=>scores.length?scores[0]:0;

// ---------- audio ----------
let ac,muted=false;
function actx(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function tone(f,d,type='square',v=.04,slide=0){if(muted)return;try{const a=actx(),t0=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d)}catch(e){}}
function noise(d,v=.08){if(muted)return;try{const a=actx(),n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}

// ---------- input ----------
const keys={},pressed={};let ptr=null,state='menu',G=null,overT=0,menuT=0;
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat)return;keys[e.code]=true;pressed[e.code]=true});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{if(state==='play')state='pause'});
function ptrPos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{const p=ptrPos(e);try{actx()}catch(_){}
  if(state==='menu'){startGame(p.y>545&&p.y<590&&p.x>130&&p.x<350);return}
  if(state==='over'){if(overT>40&&!G.needName)startGame();return}
  if(state==='pause'){state='play';return}
  if(state==='upgrade'){const i=cardAt(p);if(i>=0)pickUpgrade(i);return}
  if(state==='play'){if(p.x>410&&p.y>630){pressed.KeyB=true;return}ptr={x:p.x,y:p.y,px:G.p.x,py:G.p.y}}});
cv.addEventListener('pointermove',e=>{if(ptr&&state==='play'){const p=ptrPos(e);G.p.tx=ptr.px+(p.x-ptr.x);G.p.ty=ptr.py+(p.y-ptr.y)}});
addEventListener('pointerup',()=>{ptr=null});


// ---------- online leaderboard (Supabase, free tier) ----------
const LB_URL='https://psntzmqxehztnsnwbuvb.supabase.co/rest/v1/scores',LB_KEY='sb_publishable_U-3dQ6yumJf3XR7cBqfLVQ_CujrMTRb';
let board=null,boardErr=false,myName='';try{myName=localStorage.getItem('novaName')||''}catch(e){}
function lbFetch(){fetch(LB_URL+'?select=name,score,wave&order=score.desc&limit=10',{headers:{apikey:LB_KEY}}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{board=d;boardErr=false}).catch(()=>{boardErr=true})}
function lbSubmit(name,score,wave){return fetch(LB_URL,{method:'POST',headers:{apikey:LB_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({name,score,wave})}).then(r=>{if(!r.ok)throw 0}).then(lbFetch).catch(()=>{boardErr=true})}
const nameBox=document.createElement('input');nameBox.maxLength=12;nameBox.placeholder='Your name';nameBox.autocomplete='off';
nameBox.style.cssText='position:fixed;display:none;z-index:5;box-sizing:border-box;font:bold 18px monospace;text-align:center;padding:8px;border-radius:8px;border:2px solid #4fc3ff;background:#0a1030;color:#fff;outline:none';
document.body.appendChild(nameBox);
function showNameBox(){const r=cv.getBoundingClientRect(),s=r.width/W;nameBox.style.left=(r.left+(W/2-110)*s)+'px';nameBox.style.top=(r.top+425*s)+'px';nameBox.style.width=220*s+'px';nameBox.style.height=40*s+'px';nameBox.style.fontSize=Math.max(14,18*s)+'px';nameBox.value='';nameBox.style.display='block';setTimeout(()=>nameBox.focus(),50)}
function hideNameBox(){nameBox.style.display='none';nameBox.blur()}
function submitName(){const n=(nameBox.value||'').replace(/[^\w .\-]/g,'').trim().slice(0,12)||'PLAYER';myName=n;try{localStorage.setItem('novaName',n)}catch(e){}
  hideNameBox();if(G){G.needName=false;G.submitted=true;lbSubmit(n,G.score,G.wave)}}
nameBox.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')submitName();else if(e.key==='Escape'){hideNameBox();if(G)G.needName=false}});
lbFetch();

// ---------- visuals: glow, background ----------
const glowCache={};
function glow(x,y,r,c,a=1){let s=glowCache[c];if(!s){s=document.createElement('canvas');s.width=s.height=64;const g=s.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,c);gr.addColorStop(.35,c+'66');gr.addColorStop(1,c+'00');g.fillStyle=gr;g.fillRect(0,0,64,64);glowCache[c]=s}
  ctx.globalAlpha=a;ctx.drawImage(s,x-r,y-r,r*2,r*2);ctx.globalAlpha=1}
const neb=document.createElement('canvas');neb.width=W;neb.height=H;
(()=>{const g=neb.getContext('2d');g.fillStyle='#04050d';g.fillRect(0,0,W,H);const cols=['#3b1d8f','#0b4f9c','#7a1d6b','#0a6b6b'];
  for(let i=0;i<12;i++){const x=rand(0,W),y=rand(0,H),r=rand(120,250),c=cols[i%4];for(const oy of[-H,0,H]){const gr=g.createRadialGradient(x,y+oy,0,x,y+oy,r);gr.addColorStop(0,c+'55');gr.addColorStop(1,c+'00');g.fillStyle=gr;g.fillRect(x-r,y+oy-r,r*2,r*2)}}})();
const stars=[];for(let l=0;l<3;l++)for(let i=0;i<[45,30,16][l];i++)stars.push({x:rand(0,W),y:rand(0,H),l});
let bgY=0;
function bgUpdate(sp=1){bgY=(bgY+.5*sp)%H;for(const s of stars){s.y+=[.5,1.3,2.8][s.l]*sp;if(s.y>H){s.y-=H;s.x=rand(0,W)}}}
function bgDraw(){ctx.drawImage(neb,0,bgY-H);ctx.drawImage(neb,0,bgY);
  for(const s of stars){ctx.fillStyle=`rgba(255,255,255,${[.35,.6,.9][s.l]})`;ctx.fillRect(s.x,s.y,s.l===2?1.6:1.2,s.l===2?7:s.l+1.5)}}

// ---------- game state ----------
const TYPES={drone:{hp:1,r:13,pts:10,vy:1.3},zig:{hp:2,r:13,pts:20,vy:1.0},tank:{hp:7,r:22,pts:60,vy:.55},diver:{hp:1,r:12,pts:25,vy:0},sniper:{hp:4,r:15,pts:50,vy:0}};
const UPS=[
 {id:'rate',n:'Rapid Fire',d:'Fire 15% faster',max:5,f:p=>p.rate*=1.15},
 {id:'dmg',n:'Heavy Rounds',d:'+40% bullet damage',max:5,f:p=>p.dmg*=1.4},
 {id:'spd',n:'Thrusters',d:'Move faster',max:3,f:p=>p.speed+=.6},
 {id:'hull',n:'Hull Plating',d:'+1 max health and heal 1',max:3,f:p=>{p.maxhp++;p.hp=Math.min(p.maxhp,p.hp+1)}},
 {id:'pierce',n:'Piercing Shots',d:'Bullets pass through +1 enemy',max:3,f:p=>p.pierce++},
 {id:'home',n:'Homing Missiles',d:'Auto-seeking missiles, +1 per level',max:4,f:p=>p.homing++},
 {id:'wing',n:'Wingman Drone',d:'A drone fights beside you',max:2,f:p=>p.wing++},
 {id:'mag',n:'Magnet',d:'Pulls in power-ups from farther',max:3,f:p=>p.magnet+=70},
 {id:'regen',n:'Shield Regen',d:'Shield recharges over time',max:3,f:p=>p.regen++},
 {id:'bomb',n:'Bomb Pack',d:'+2 bombs (max 5)',max:9,f:p=>p.bombs=Math.min(5,p.bombs+2)},
 {id:'gun',n:'Weapon Upgrade',d:'+1 weapon level (max 5)',max:4,f:p=>p.wpn=Math.min(5,p.wpn+1)}
];
let tutDone=false;try{tutDone=localStorage.getItem('novaTut')==='1'}catch(e){}
function startGame(tut){
  hideNameBox();if(typeof tut!=='boolean')tut=!tutDone&&!DEMO;
  G={score:0,wave:0,t:0,combo:0,comboT:0,maxCombo:0,kills:0,shake:0,flash:0,queue:[],bullets:[],eb:[],en:[],parts:[],rings:[],txt:[],pw:[],ms:[],boss:null,banner:0,bannerTxt:'',bosses:0,cards:null,hitWave:false,newBest:false,msT:0,
    p:{x:W/2,y:H-110,hp:4,maxhp:4,fire:0,inv:0,shield:0,shieldCd:2200,bombs:2,wpn:1,dmg:1,rate:1,speed:4.6,pierce:0,homing:0,wing:0,magnet:60,regen:0,tx:null,ty:null,up:{}}};
  G.tut=tut?{step:0,t:0,ok:false,wait:0,moved:0,shots:0,k0:0,bombed:false,got:false}:null;state='play';nextWave();tone(440,.25,'sine',.06,440);
}
function nextWave(){G.wave++;G.hitWave=false;const boss=G.wave%5===0;G.banner=130;G.bannerTxt=boss?'WARNING':'WAVE '+G.wave;spawnWave()}
function spawnWave(){
  const w=G.wave;if(w%5===0){const n=w/5,k=(n-1)%3,hp=110+w*16;G.boss={x:W/2,y:-90,hp,max:hp,r:46,t:0,kind:k,ph:0,f:60,f2:100,enter:true,hf:0,n,name:['DREADNOUGHT','SPECTER','HYDRA'][k]};return}
  let budget=3+w*1.7+Math.max(0,w-8)*1.3;const avail=['drone','zig'];if(w>=3)avail.push('tank','diver');if(w>=4)avail.push('sniper');
  const cost={drone:1,zig:1.4,tank:3.5,diver:1.4,sniper:3};let tm=70;const form=irand(0,2);
  while(budget>0){const ty=w<3?(Math.random()<.6?'drone':'zig'):avail[irand(0,avail.length-1)];budget-=cost[ty];
    const grp=(ty==='tank'||ty==='sniper')?1:irand(2,5),bx=rand(60,W-60);
    for(let i=0;i<grp;i++){const x=form===0?bx+(i-grp/2)*38:form===1?bx+(i%2?1:-1)*i*22:rand(40,W-40);G.queue.push({t:G.t+tm+i*14,ty,x:clamp(x,24,W-24)})}
    tm+=rand(40,90)}
}
function mkEnemy(ty,x,y=-30){const d=TYPES[ty],w=G.wave,sc=1+Math.floor(w/6)*.5;
  const e={ty,x,y,sx:x,hp:Math.ceil(d.hp*sc),r:d.r,ph:rand(0,6.28),t:0,f:rand(70,170),vy:d.vy+Math.min(w*.03,.8),st:0,hf:0,dir:Math.random()<.5?-1:1,ty2:rand(70,160)};e.max=e.hp;G.en.push(e)}
const bspd=()=>Math.min(2.0+G.wave*.09,4.8);
function ebul(x,y,a,s,c='#ff4fa3'){G.eb.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c})}
function aimAt(e){return Math.atan2(G.p.y-e.y,G.p.x-e.x)}
const mult=()=>1+Math.min(Math.floor(G.combo/4)*.25,4);

// ---------- effects ----------
function sparks(x,y,c,n,sp=4,l=30){for(let i=0;i<n;i++){const a=rand(0,6.283),s=rand(.5,sp);G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rand(l*.5,l),m:l,c})}}
function boom(x,y,c,n=22,big=1){sparks(x,y,c,n,5*big,38);sparks(x,y,'#ffffff',Math.floor(n/4),3*big,18);G.rings.push({x,y,r:4,m:34*big,c});noise(.25*big,.07)}
function popText(x,y,s,c='#ffffff'){G.txt.push({x,y,s,c,l:50})}
function shake(n){G.shake=Math.max(G.shake,n)}

// ---------- combat ----------
function hurt(){const p=G.p;if(p.inv>0)return;
  if(p.shield>0){p.shield=0;p.inv=70;p.shieldCd=Math.max(900,2200-p.regen*500);G.rings.push({x:p.x,y:p.y,r:10,m:60,c:'#4fc3ff'});tone(300,.25,'sine',.07,-150);return}
  p.hp--;p.inv=120;shake(14);G.flash=.35;p.wpn=Math.max(1,p.wpn-1);G.combo=0;G.hitWave=true;boom(p.x,p.y,'#4fc3ff',26);tone(110,.4,'sawtooth',.08,-60);
  if(p.hp<=0)gameOver()}
function gameOver(){state='over';overT=0;boom(G.p.x,G.p.y,'#4fc3ff',60,2);shake(24);
  G.newBest=G.score>bestScore()&&G.score>0;if(G.score>0){scores.push(G.score);scores.sort((a,b)=>b-a);scores=scores.slice(0,5)}try{localStorage.setItem('novaScores2',JSON.stringify(scores))}catch(e){}
  G.needName=false;G.submitted=false;
  if(!DEMO&&G.score>0){if(myName){G.submitted=true;lbSubmit(myName,G.score,G.wave)}else{G.needName=true;showNameBox()}}}
function shoot(){const p=G.p,w=p.wpn;
  const add=(dx,ang)=>G.bullets.push({x:p.x+dx,y:p.y-18,vx:Math.sin(ang)*11,vy:-Math.cos(ang)*11,dmg:p.dmg,pierce:p.pierce,hit:[]});
  if(w===1)add(0,0);else if(w===2){add(-8,0);add(8,0)}else if(w===3){add(0,0);add(-10,-.12);add(10,.12)}else if(w===4){add(-8,0);add(8,0);add(-14,-.2);add(14,.2)}else{add(0,0);add(-9,-.1);add(9,.1);add(-16,-.24);add(16,.24)}
  for(let i=0;i<p.wing;i++){const sx=(p.wing===1?1:(i?1:-1))*38;G.bullets.push({x:p.x+sx,y:p.y,vx:0,vy:-11,dmg:p.dmg*.6,pierce:0,hit:[]})}
  if(G.tut)G.tut.shots++;tone(780,.05,'square',.018,-420)}
function bomb(){const p=G.p;if(p.bombs<=0)return;p.bombs--;if(G.tut){G.tut.bombed=true;p.bombs++}p.inv=Math.max(p.inv,70);G.flash=.7;shake(18);noise(.6,.12);tone(90,.7,'sawtooth',.09,-40);
  G.rings.push({x:p.x,y:p.y,r:10,m:420,c:'#ffd27a',fast:1});for(const b of G.eb){sparks(b.x,b.y,'#ffd27a',3,2,20);G.score+=1}G.eb.length=0;
  for(const e of G.en)if(!e.dead)hitEnemy(e,12,e.x,e.y);if(G.boss&&!G.boss.enter)hitBoss(30)}
function hitEnemy(e,d,x,y){if(e.dead)return;e.hp-=d;e.hf=4;sparks(x,y,'#ffe9a8',3,3,14);if(e.hp<=0){e.dead=true;killEnemy(e)}else tone(220,.05,'square',.02)}
function killEnemy(e){const pts=Math.round(TYPES[e.ty].pts*mult());G.score+=pts;G.combo++;G.comboT=160;G.maxCombo=Math.max(G.maxCombo,G.combo);G.kills++;
  const col={drone:'#ff4d6d',zig:'#ffa62b',tank:'#8e5bff',diver:'#2ef2c0',sniper:'#ffe14d'}[e.ty];boom(e.x,e.y,col,e.ty==='tank'?40:20,e.ty==='tank'?1.6:1);if(e.ty==='tank')shake(7);
  popText(e.x,e.y-10,'+'+pts);const ch=e.ty==='tank'?.4:e.ty==='sniper'?.3:.09;if(Math.random()<ch)drop(e.x,e.y)}
function drop(x,y){const r=Math.random()*100,t=r<30?'gun':r<55?'shield':r<75?'heal':'bomb';G.pw.push({x,y,t,ph:rand(0,6)})}
function hitBoss(d){const b=G.boss;if(!b)return;b.hp-=d;b.hf=3;if(b.hp<=0)killBoss();else if(G.t%4===0)tone(160,.04,'square',.02)}
function killBoss(){const b=G.boss;G.boss=null;G.bosses++;G.score+=1000+G.wave*50;G.flash=.8;shake(30);G.eb.length=0;
  for(let i=0;i<10;i++)setTimeout(()=>{if(G)boom(b.x+rand(-60,60),b.y+rand(-30,30),['#ff9d3c','#ffffff','#ff4d6d'][i%3],36,1.6)},i*90);
  popText(b.x,b.y,'BOSS DOWN +'+(1000+G.wave*50),'#ffd27a');drop(b.x-30,b.y);G.pw.push({x:b.x+30,y:b.y,t:'heal',ph:0});G.pw.push({x:b.x,y:b.y+20,t:'bomb',ph:1});tone(70,1,'sawtooth',.1,-20)}

// ---------- upgrades ----------
function offerUpgrades(){const p=G.p;const pool=UPS.filter(u=>(p.up[u.id]||0)<u.max);for(let i=pool.length-1;i>0;i--){const j=irand(0,i);[pool[i],pool[j]]=[pool[j],pool[i]]}
  G.cards=pool.slice(0,3);G.cardT=0;state='upgrade'}
const cardAt=p=>{if(!G.cards)return -1;for(let i=0;i<G.cards.length;i++)if(p.x>40&&p.x<440&&p.y>200+i*130&&p.y<200+i*130+112)return i;return -1};
function pickUpgrade(i){const u=G.cards&&G.cards[i];if(!u)return;if(G.tut)finishTut();u.f(G.p);G.p.up[u.id]=(G.p.up[u.id]||0)+1;G.cards=null;tone(520,.12,'sine',.06,520);state='play';nextWave()}

// ---------- autopilot (?demo) ----------
function auto(p){let tgt=null,bd=1e9;for(const e of G.en){if(e.y>0&&e.y<p.y){const d=Math.abs(e.x-p.x)+(p.y-e.y)*.3;if(d<bd){bd=d;tgt=e}}}
  let tx=G.boss?G.boss.x:tgt?tgt.x:W/2,ty=H-120,danger=0;
  for(const b of G.eb){const dy=p.y-b.y;if(dy>-10&&dy<130&&Math.abs(b.x-p.x)<30){danger++;tx=p.x+(b.x<p.x?70:-70)}if(Math.hypot(b.x-p.x,b.y-p.y)<60)danger+=2}
  for(const e of G.en){if(Math.hypot(e.x-p.x,e.y-p.y)<70){tx=p.x+(e.x<p.x?70:-70);ty=Math.min(H-40,p.y+40)}}
  const pw=G.pw.find(q=>q.y>H*.4&&(q.t!=='bomb'||p.bombs<4));if(pw&&danger<2)tx=pw.x;
  return{dx:tx>p.x+5?1:tx<p.x-5?-1:0,dy:ty>p.y+8?1:ty<p.y-8?-1:0,bomb:danger>=7&&p.bombs>0}}


// ---------- tutorial ----------
const TUT=[
 {t:'MOVE',d:'Use WASD or the arrow keys. On touch screens, drag your finger.'},
 {t:'FIRE',d:'Hold SPACE to shoot. On touch screens you auto-fire while dragging.'},
 {t:'DESTROY ENEMIES',d:'Shoot 3 enemies. Kill them quickly in a row to build a combo multiplier.'},
 {t:'BOMB',d:'Press B (touch: BOMB button) to wipe all bullets and hurt everything. Free during the tutorial.'},
 {t:'POWER-UPS',d:'Grab the falling G to level up your gun. Also S = shield, + = health, B = bomb.'},
 {t:"YOU'RE READY",d:'Clear the wave, then pick an upgrade. P = pause, SHIFT = precise movement. Good luck!'}
];
function finishTut(){G.tut=null;tutDone=true;try{localStorage.setItem('novaTut','1')}catch(e){}}
function tutUpdate(){const T=G.tut;T.t++;
  if(T.step<5){let ok=false;
    if(T.step===0)ok=T.moved>220;else if(T.step===1)ok=T.shots>=12;else if(T.step===2)ok=G.kills-T.k0>=3;else if(T.step===3)ok=T.bombed;else ok=T.got||T.t>900;
    if(ok&&!T.ok){T.ok=true;T.wait=45;tone(700,.15,'sine',.06,500)}
    if(T.ok&&--T.wait<=0){T.step++;T.t=0;T.ok=false;if(T.step===2)T.k0=G.kills;if(T.step===4)G.pw.push({x:W/2,y:-10,t:'gun',ph:0})}
  }else if(T.t>420)finishTut()}

// ---------- update ----------
function update(){
  if(pressed.KeyM)muted=!muted;
  if(state==='menu'){menuT++;bgUpdate(.6);if(pressed.KeyH)startGame(true);else if(pressed.Enter||pressed.Space||DEMO)startGame()}
  else if(state==='over'){overT++;bgUpdate(.4);fxUpdate();if(overT>40&&!G.needName&&(pressed.Enter||pressed.Space))startGame();if(DEMO&&overT>200)startGame()}
  else if(state==='pause'){if(pressed.KeyP||pressed.Escape||pressed.Enter)state='play'}
  else if(state==='upgrade'){bgUpdate(.3);fxUpdate();G.cardT++;for(let i=0;i<3;i++)if(pressed['Digit'+(i+1)]||pressed['Numpad'+(i+1)])pickUpgrade(i);if(DEMO&&G.cardT>45)pickUpgrade(irand(0,G.cards.length-1))}
  else if(state==='play'){if(pressed.KeyP||pressed.Escape){state='pause'}else playUpdate()}
  for(const k in pressed)delete pressed[k];
}
function fxUpdate(){const g=G;

  ctx.textAlign='left';ctx.font='bold 11px monospace';ctx.fillStyle='#ffd27a';ctx.fillText('BOMBS '+'\u25CF'.repeat(p.bombs)+'\u25CB'.repeat(5-p.bombs),12,70);
  ctx.fillStyle='#ffe14d';ctx.fillText('GUN LV'+p.wpn,12,84);
  if(g.combo>=2){ctx.textAlign='right';ctx.font='bold 14px monospace';ctx.fillStyle='#5dff9a';ctx.fillText('COMBO '+g.combo+'  x'+mult().toFixed(2),W-12,46);ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(W-112,52,100,4);ctx.fillStyle='#5dff9a';ctx.fillRect(W-112,52,100*g.comboT/160,4)}
  if('ontouchstart' in window){ctx.globalAlpha=.5;ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(448,668,26,0,6.283);ctx.fill();ctx.fillStyle='#101420';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('BOMB',448,673);ctx.globalAlpha=1}
  if(g.banner>0){const a=Math.min(1,g.banner/30,(130-g.banner)/15);ctx.globalAlpha=a;const boss=g.wave%5===0;txtC(g.bannerTxt,H/2-60,boss?46:40,boss?'#ff4d6d':'#8fdcff');
    if(boss)txtC('BOSS APPROACHING',H/2-26,16,'#fff');ctx.globalAlpha=1}}
function drawCards(){ctx.fillStyle='rgba(2,3,12,.72)';ctx.fillRect(0,0,W,H);txtC('WAVE '+(G.wave)+' CLEARED',120,30,'#8fdcff');txtC('Choose an upgrade  (press 1 / 2 / 3 or tap)',152,14,'#c9d6ff');
  G.cards.forEach((u,i)=>{const y=200+i*130,lv=(G.p.up[u.id]||0);ctx.fillStyle='rgba(30,40,90,.85)';ctx.fillRect(40,y,400,112);ctx.strokeStyle='#4fc3ff';ctx.lineWidth=2;ctx.strokeRect(40,y,400,112);
    ctx.textAlign='left';ctx.fillStyle='#4fc3ff';ctx.font='bold 26px monospace';ctx.fillText(String(i+1),58,y+66);ctx.fillStyle='#fff';ctx.font='bold 22px system-ui,sans-serif';ctx.fillText(u.n,100,y+44);
    ctx.fillStyle='#b8c6f0';ctx.font='15px system-ui,sans-serif';ctx.fillText(u.d,100,y+72);ctx.fillStyle='#ffd27a';ctx.font='bold 12px monospace';ctx.fillText('LEVEL '+lv+' > '+(lv+1)+'  /  '+u.max,100,y+96)})}
function drawMenu(){const t=menuT;txtC('NOVA STRIKE',230,58,'#4fc3ff');ctx.globalCompositeOperation='lighter';glow(W/2,215,200,'#2f6bff',.25+Math.sin(t/30)*.08);ctx.globalCompositeOperation='source-over';
  drawPlayer({x:W/2,y:330+Math.sin(t/25)*8,wing:1,shield:0,inv:0},t);
  txtC('Press ENTER or tap to start',420,20,'#fff');ctx.fillStyle='#9fb0d8';
  txtC('Move: WASD / arrows    Fire: SPACE (hold)',470,14,'#9fb0d8');txtC('Bomb: B    Focus (slow, shows hitbox): SHIFT',492,14,'#9fb0d8');txtC('Pause: P    Mute: M    Touch: drag to move, auto-fire',514,14,'#9fb0d8');
  ctx.strokeStyle='#4fc3ff';ctx.lineWidth=1.5;ctx.strokeRect(140,552,200,28);txtC('HOW TO PLAY  (H)',571,14,'#8fdcff');
  if(board&&board.length){txtC('WORLD TOP 3',596,14,'#ffd27a','monospace');board.slice(0,3).forEach((s,i)=>txtC((i+1)+'.  '+s.name+'  '+s.score,618+i*20,15,'#fff','monospace'))}
  else if(scores.length){txtC('YOUR BEST',596,14,'#ffd27a','monospace');scores.slice(0,3).forEach((s,i)=>txtC((i+1)+'.  '+s,618+i*20,15,'#fff','monospace'))}}
function drawOver(){ctx.fillStyle='rgba(2,3,12,.72)';ctx.fillRect(0,0,W,H);txtC('GAME OVER',200,52,'#ff4d6d');if(G.newBest)txtC('NEW PERSONAL BEST!',236,18,'#ffd27a');
  txtC('Score  '+G.score,288,26,'#fff','monospace');txtC('Wave '+G.wave+'   Kills '+G.kills+'   Best combo '+G.maxCombo+'   Bosses '+G.bosses,320,13,'#b8c6f0','monospace');
  if(G.needName){txtC('Enter your name for the world leaderboard',400,16,'#8fdcff');txtC('ENTER = submit      ESC = skip',496,13,'#9fb0d8','monospace');return}
  if(board&&board.length){txtC('WORLD TOP 10',366,14,'#ffd27a','monospace');let me=-1;if(G.submitted)me=board.findIndex(s=>s.name===myName&&s.score===G.score);
    board.slice(0,10).forEach((s,i)=>{ctx.textAlign='left';ctx.font='15px monospace';ctx.fillStyle=i===me?'#5dff9a':'#fff';ctx.fillText(String(i+1).padStart(2)+'. '+s.name.padEnd(12),110,392+i*20);ctx.textAlign='right';ctx.fillText(String(s.score),370,392+i*20)});
    if(G.submitted&&me<0)txtC('Your score was submitted',604,12,'#9fb0d8','monospace')}
  else{txtC(boardErr?'Leaderboard offline. Your best scores:':'YOUR BEST SCORES',380,14,'#ffd27a','monospace');scores.forEach((s,i)=>txtC((i+1)+'.  '+s,410+i*22,16,'#fff','monospace'))}
  if(overT>40)txtC('Press ENTER or tap to play again',650,18,'#8fdcff')}
function draw(){
  ctx.save();if(G&&G.shake>.5&&state!=='pause')ctx.translate(rand(-G.shake,G.shake),rand(-G.shake,G.shake));
  bgDraw();
  if(state==='menu')drawMenu();
  else{drawWorld();if(state!=='over')drawHUD();if(G.tut&&state==='play')drawTut();
    if(state==='upgrade')drawCards();if(state==='over')drawOver();
    if(state==='pause'){ctx.fillStyle='rgba(2,3,12,.6)';ctx.fillRect(0,0,W,H);txtC('PAUSED',H/2,44,'#fff');txtC('Press P / tap to resume',H/2+34,16,'#9fb0d8')}
    if(G.flash>.02){ctx.fillStyle=`rgba(255,255,255,${Math.min(.8,G.flash)})`;ctx.fillRect(-10,-10,W+20,H+20)}}
  ctx.restore()}
// ---------- main loop (fixed 60Hz timestep) ----------
let last=0,acc=0;
function loop(ts){const dt=Math.min(100,ts-(last||ts));last=ts;acc+=dt;let n=0;while(acc>=16.667&&n++<5){update();acc-=16.667}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
